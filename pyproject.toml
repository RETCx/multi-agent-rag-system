[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-rag-system"
version = "0.1.0"
description = "Two-agent RAG system using LangGraph: TF-IDF retrieval + LLM report generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain==1.3.16",
    "langgraph==1.2.11",
    "langchain-openai==1.6.0",
    "scikit-learn==1.9.0",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff",
    "black",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.urls]
"Homepage" = "https://github.com/RETCx/multi-agent-rag-system"
